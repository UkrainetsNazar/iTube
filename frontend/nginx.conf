server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (e.g. /watch/abc123) -- these
    # paths don't exist as files, so nginx must fall back to index.html
    # and let the router handle it, instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
